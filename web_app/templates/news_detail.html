<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ item.title }}</title>
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Arial;background:#f3f5f8;margin:0;color:#1f2937;min-height:100vh;display:flex;flex-direction:column}
    header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
    .brand{font-size:24px;font-weight:700;color:#1f2937;text-decoration:none}
    .btn{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}
    .container{max-width:900px;margin:24px auto;padding:0 16px;flex:1;width:100%}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px}
    .title{font-size:30px;font-weight:700;margin:0 0 8px}
    .meta{font-size:13px;color:#6b7280}
    .back{display:inline-block;margin-bottom:14px;color:#2563eb;text-decoration:none;font-weight:600}
    p{line-height:1.6}
    * {box-sizing: border-box;}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Новости</a>
    <a class="btn" href="/">Предложить новость</a>
  </header>

  <div class="container">
    <a class="back" href="/">← К списку новостей</a>
    <article class="card">
      <h1 class="title">{{ item.title }}</h1>
      <div class="meta">Опубликовано: {{ item.created_at | format_pub_date }}</div>
      <p>{{ item.text }}</p>
      {% if item.source_url %}<div class="meta">Источник: {{ item.source_url }}</div>{% endif %}
    </article>
  </div>
</body>
</html>
