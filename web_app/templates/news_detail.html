<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ item.title }}</title>
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Arial;background:#f3f5f8;margin:0;color:#1f2937}
    .container{max-width:900px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px}
    .title{font-size:30px;font-weight:700;margin:0 0 8px}
    .meta{font-size:13px;color:#6b7280}
    .back{display:inline-block;margin-bottom:14px;color:#2563eb;text-decoration:none;font-weight:600}
    p{line-height:1.6}
  </style>
</head>
<body>
  <div class="container">
    <a class="back" href="/">← К списку новостей</a>
    <article class="card">
      <h1 class="title">{{ item.title }}</h1>
      <div class="meta">Опубликовано: {{ item.created_at[:19].replace('T', ' ') }} UTC</div>
      <p>{{ item.text }}</p>
      {% if item.source_url %}<div class="meta">Источник: {{ item.source_url }}</div>{% endif %}
    </article>
  </div>
</body>
</html>
